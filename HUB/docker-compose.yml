services:
  wireguard-hub:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: connectpi-wireguard-hub
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-}
    ports:
      - "${WG_TRUSTED_PORT:-51821}:${WG_TRUSTED_PORT:-51821}/udp"
      - "${WG_UNTRUSTED_PORT:-51820}:${WG_UNTRUSTED_PORT:-51820}/udp"
      - "${MGMT_SSH_PORT:-2222}:22/tcp"
    volumes:
      - ./wireguard/trusted/config:/config
      - ./wireguard/untrusted/config/wg_confs/wg-untrusted.conf:/config/wg_confs/wg-untrusted.conf
      - /etc/localtime:/etc/localtime:ro
      # For Linux hosts that need module visibility from the container.
      # Uncomment only when deploying on Linux and /lib/modules exists.
      # - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  consolepi:
    build:
      context: ./consolepi
      dockerfile: Dockerfile
    image: connectpi/consolepi-hub:bookworm
    container_name: connectpi-consolepi
    depends_on:
      - wireguard-hub
    network_mode: service:wireguard-hub
    environment:
      - TRUSTED_SSH_INTERFACE=${TRUSTED_SSH_INTERFACE:-wg-trusted}
      - UNTRUSTED_SSH_INTERFACE=${UNTRUSTED_SSH_INTERFACE:-wg-untrusted}
      - MGMT_ALLOWED_DIRECT_SSH=${MGMT_ALLOWED_DIRECT_SSH:-}
      - ALLOW_DIRECT_SSH_CIDRS=${ALLOW_DIRECT_SSH_CIDRS:-}
      - MGMT_SSH_ALLOW_CIDRS=${MGMT_SSH_ALLOW_CIDRS:-}
      - CONSOLEPI_SSH_PASSWORD_AUTH=${CONSOLEPI_SSH_PASSWORD_AUTH:-false}
      - CONSOLEPI_ALLOW_USERS=${CONSOLEPI_ALLOW_USERS:-consolepi}
      - CONSOLEPI_USERS_FILE=${CONSOLEPI_USERS_FILE:-/ssh/users.conf}
    volumes:
      - ./consolepi/data:/data
      - ./consolepi/data/log:/var/log/ConsolePi
      - ./consolepi/ssh:/ssh
      - /etc/localtime:/etc/localtime:ro
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  default:
    name: hub_default
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.21.0/24
          gateway: 10.250.21.1
