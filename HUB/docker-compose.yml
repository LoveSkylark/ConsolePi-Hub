services:
  wireguard-trusted:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: connectpi-wireguard-trusted
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "${WG_TRUSTED_PORT:-51821}:51820/udp"
    volumes:
      - ./wireguard/trusted/config:/config
      # For Linux hosts that need module visibility from the container.
      # Uncomment only when deploying on Linux and /lib/modules exists.
      # - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  wireguard-untrusted:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: connectpi-wireguard-untrusted
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "${WG_UNTRUSTED_PORT:-51820}:51820/udp"
    volumes:
      - ./wireguard/untrusted/config:/config
      # For Linux hosts that need module visibility from the container.
      # Uncomment only when deploying on Linux and /lib/modules exists.
      # - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  consolepi:
    build:
      context: ./consolepi
      dockerfile: Dockerfile
    image: connectpi/consolepi-hub:bookworm
    container_name: connectpi-consolepi
    profiles:
      - consolepi
    depends_on:
      - wireguard-trusted
      - wireguard-untrusted
    network_mode: service:wireguard-trusted
    environment:
      - TRUSTED_SSH_INTERFACE=${TRUSTED_SSH_INTERFACE:-wg-trusted}
      - UNTRUSTED_SSH_INTERFACE=${UNTRUSTED_SSH_INTERFACE:-wg-untrusted}
    volumes:
      - ./consolepi/data:/data
      - ./consolepi/workspace:/workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
